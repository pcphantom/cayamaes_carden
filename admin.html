<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cayamae's Ancient Garden Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1c1510;
      --forest: #17301d;
      --forest-deep: #102317;
      --moss: #4a6741;
      --sage: #7a9e72;
      --gold: #c8973a;
      --gold-light: #e2b86a;
      --cream: #f6f0e4;
      --parchment: #ebe2cc;
      --line: rgba(200, 151, 58, 0.22);
      --line-strong: rgba(200, 151, 58, 0.4);
      --danger: #d95b4d;
      --success: #7eba74;
      --text-dim: rgba(246, 240, 228, 0.68);
      --shadow: rgba(0, 0, 0, 0.35);
      --font-display: 'Playfair Display', serif;
      --font-body: 'Cormorant Garamond', serif;
      --font-ui: 'Jost', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(122, 158, 114, 0.16), transparent 30%),
        radial-gradient(circle at bottom right, rgba(200, 151, 58, 0.12), transparent 28%),
        linear-gradient(160deg, #0d160f 0%, #132418 45%, #0b120c 100%);
      color: var(--cream);
      font-family: var(--font-ui);
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .login-card {
      width: min(100%, 420px);
      background: rgba(17, 35, 23, 0.92);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 30px 60px var(--shadow);
      padding: 34px 30px;
      backdrop-filter: blur(18px);
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold-light);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .login-badge::before {
      content: '';
      width: 24px;
      height: 1px;
      background: currentColor;
    }

    .login-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 7vw, 2.6rem);
      line-height: 1.05;
      margin-bottom: 8px;
    }

    .login-copy {
      color: var(--text-dim);
      line-height: 1.7;
      margin-bottom: 26px;
    }

    .login-group {
      margin-bottom: 16px;
    }

    .login-label,
    .field-label {
      display: block;
      font-size: 0.76rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 7px;
    }

    .text-input,
    .text-area {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(245, 240, 230, 0.06);
      color: var(--cream);
      border-radius: 12px;
      padding: 12px 14px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .text-input:focus,
    .text-area:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(245, 240, 230, 0.1);
    }

    .text-area {
      min-height: 120px;
      resize: vertical;
    }

    .login-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 6px;
    }

    .primary-btn,
    .ghost-btn,
    .danger-btn,
    .icon-btn {
      border: none;
      border-radius: 999px;
      padding: 11px 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.75rem;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .primary-btn {
      background: var(--gold);
      color: var(--ink);
      font-weight: 600;
    }

    .primary-btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }

    .ghost-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--cream);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ghost-btn:hover {
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .danger-btn {
      background: rgba(217, 91, 77, 0.14);
      color: #ffc3bc;
      border: 1px solid rgba(217, 91, 77, 0.24);
    }

    .danger-btn:hover {
      background: rgba(217, 91, 77, 0.2);
    }

    .icon-btn {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding-inline: 12px;
    }

    .icon-btn:hover {
      color: var(--cream);
      border-color: var(--gold);
    }

    .login-error {
      min-height: 22px;
      color: #ffc3bc;
      margin-top: 12px;
      font-size: 0.92rem;
    }

    #adminApp {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    .admin-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 18, 12, 0.92);
      backdrop-filter: blur(14px);
    }

    .admin-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
    }

    .admin-subtitle {
      color: var(--text-dim);
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .admin-shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: calc(100vh - 89px);
    }

    .admin-sidebar {
      border-right: 1px solid var(--line);
      background: rgba(16, 35, 23, 0.88);
      padding: 26px 18px;
    }

    .sidebar-label {
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 14px;
      padding-left: 10px;
    }

    .sidebar-list {
      display: grid;
      gap: 6px;
    }

    .sidebar-item {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      text-align: left;
      padding: 12px 14px;
      border-radius: 14px;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .sidebar-item:hover,
    .sidebar-item.active {
      color: var(--cream);
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.04);
    }

    .admin-main {
      padding: 26px 24px 90px;
      overflow: auto;
    }

    .panel-header {
      margin-bottom: 22px;
    }

    .panel-kicker {
      color: var(--gold-light);
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1.05;
      margin-bottom: 10px;
    }

    .panel-copy {
      max-width: 72ch;
      color: var(--text-dim);
      line-height: 1.7;
    }

    .card-stack {
      display: grid;
      gap: 18px;
    }

    .editor-card,
    .array-item {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(245, 240, 230, 0.04);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.14);
    }

    .editor-card {
      padding: 18px;
    }

    .card-head,
    .array-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card-title,
    .array-item-title {
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    .field-grid {
      display: grid;
      gap: 14px;
    }

    .field-row {
      display: grid;
      gap: 8px;
    }

    .field-help {
      color: var(--text-dim);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .array-list {
      display: grid;
      gap: 14px;
    }

    .array-item {
      padding: 16px;
    }

    .array-item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--gold);
    }

    .empty-state {
      border: 1px dashed var(--line-strong);
      border-radius: 14px;
      padding: 16px;
      color: var(--text-dim);
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .status-bar {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 60;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(12, 21, 14, 0.96);
      border: 1px solid var(--line-strong);
      box-shadow: 0 20px 40px var(--shadow);
      transform: translateY(120%);
      transition: transform 0.25s ease;
    }

    .status-bar.show {
      transform: translateY(0);
    }

    .status-bar.success {
      color: #dff2d9;
      border-color: rgba(126, 186, 116, 0.4);
    }

    .status-bar.error {
      color: #ffd5d0;
      border-color: rgba(217, 91, 77, 0.38);
    }

    @media (max-width: 980px) {
      .admin-shell {
        grid-template-columns: 1fr;
      }

      .admin-sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
      }

      .sidebar-list {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
    }

    @media (max-width: 720px) {
      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        justify-content: flex-start;
      }

      .admin-main,
      .admin-sidebar {
        padding-inline: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-badge">Admin Access</div>
      <h1 class="login-title">Cayamae's Ancient Garden</h1>
      <p class="login-copy">Sign in to edit homepage text, product details, navigation copy, footer content, and SEO data stored in <strong>content.json</strong>.</p>
      <div class="login-group">
        <label class="login-label" for="loginUsername">Username</label>
        <input class="text-input" id="loginUsername" type="text" autocomplete="username" value="admin">
      </div>
      <div class="login-group">
        <label class="login-label" for="loginPassword">Password</label>
        <input class="text-input" id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter admin password">
      </div>
      <div class="login-actions">
        <button class="primary-btn" id="loginButton" type="button">Sign In</button>
      </div>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div id="adminApp">
    <header class="admin-header">
      <div>
        <div class="admin-title">Cayamae's Ancient Garden</div>
        <div class="admin-subtitle">Content and SEO editor</div>
      </div>
      <div class="header-actions">
        <button class="ghost-btn" id="viewSiteButton" type="button">View Site</button>
        <button class="primary-btn" id="saveButton" type="button" disabled>Save Changes</button>
        <button class="danger-btn" id="logoutButton" type="button">Sign Out</button>
      </div>
    </header>

    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="sidebar-label">Sections</div>
        <div class="sidebar-list" id="sidebarList"></div>
      </aside>

      <main class="admin-main">
        <div class="panel-header">
          <div class="panel-kicker">Editable Section</div>
          <h2 class="panel-title" id="panelTitle"></h2>
          <p class="panel-copy" id="panelCopy"></p>
        </div>
        <div class="card-stack" id="panelRoot"></div>
      </main>
    </div>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <script>
    const SECTION_LABELS = {
      site: 'Site Settings',
      nav: 'Navigation',
      hero: 'Hero',
      philosophy: 'Our Story',
      products: 'Products',
      spiritual: 'Spiritual Services',
      support: 'Support Section',
      testimonials: 'Testimonials',
      footer: 'Footer',
      seo: 'SEO'
    };

    const SECTION_DESCRIPTIONS = {
      site: 'Branding, contact details, and reusable business information.',
      nav: 'Header and navigation link labels, destinations, and external-link flags.',
      hero: 'Top-of-page messaging, calls to action, and the intro copy.',
      philosophy: 'Storytelling, philosophy copy, and supporting pillar statements.',
      products: 'Filter labels, product cards, prices, badges, and ordering calls to action.',
      spiritual: 'Service descriptions, sacred offering labels, and contact card copy.',
      support: 'Patreon support messaging and button text.',
      testimonials: 'Customer quotes, names, and locations.',
      footer: 'Footer navigation, contact content, copyright, and social links.',
      seo: 'Search metadata, schema fields, canonical settings, and FAQ schema content.'
    };

    let contentData = null;
    let activeSection = 'site';
    let dirty = false;
    const arrayTemplates = new Map();

    const loginScreen = document.getElementById('loginScreen');
    const adminApp = document.getElementById('adminApp');
    const sidebarList = document.getElementById('sidebarList');
    const panelTitle = document.getElementById('panelTitle');
    const panelCopy = document.getElementById('panelCopy');
    const panelRoot = document.getElementById('panelRoot');
    const statusBar = document.getElementById('statusBar');
    const saveButton = document.getElementById('saveButton');
    const loginError = document.getElementById('loginError');
    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');

    document.getElementById('loginButton').addEventListener('click', doLogin);
    document.getElementById('viewSiteButton').addEventListener('click', () => window.open('/', '_blank'));
    document.getElementById('saveButton').addEventListener('click', saveContent);
    document.getElementById('logoutButton').addEventListener('click', logout);
    loginPassword.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        doLogin();
      }
    });

    document.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
        event.preventDefault();
        if (contentData) {
          saveContent();
        }
      }
    });

    window.addEventListener('beforeunload', (event) => {
      if (!dirty) {
        return;
      }
      event.preventDefault();
      event.returnValue = '';
    });

    boot();

    async function boot() {
      const authenticated = await checkAuth();
      if (authenticated) {
        await loadContent();
        showApp();
        return;
      }
      showLogin();
    }

    async function checkAuth() {
      try {
        const response = await fetch('/api/admin/check', { cache: 'no-store' });
        return response.ok;
      } catch {
        return false;
      }
    }

    function showLogin() {
      loginScreen.style.display = 'flex';
      adminApp.style.display = 'none';
      loginError.textContent = '';
      loginPassword.value = '';
    }

    function showApp() {
      loginScreen.style.display = 'none';
      adminApp.style.display = 'flex';
    }

    async function doLogin() {
      loginError.textContent = '';
      const response = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: loginUsername.value.trim(),
          password: loginPassword.value
        })
      });

      if (!response.ok) {
        const payload = await response.json().catch(() => ({ error: 'Login failed.' }));
        loginError.textContent = payload.error || 'Login failed.';
        return;
      }

      await loadContent();
      showApp();
      setStatus('Signed in successfully.');
    }

    async function logout() {
      await fetch('/api/admin/logout', { method: 'POST' });
      showLogin();
    }

    async function loadContent() {
      const response = await fetch(`/content.json?ts=${Date.now()}`, { cache: 'no-store' });
      contentData = await response.json();
      captureArrayTemplates(contentData);
      if (!contentData[activeSection]) {
        activeSection = Object.keys(contentData)[0];
      }
      buildSidebar();
      renderActiveSection();
      setDirty(false);
    }

    async function saveContent() {
      if (!contentData) {
        return;
      }

      saveButton.disabled = true;
      const response = await fetch('/api/admin/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(contentData)
      });

      if (!response.ok) {
        const payload = await response.json().catch(() => ({ error: 'Save failed.' }));
        setStatus(payload.error || 'Save failed.', 'error');
        setDirty(true);
        return;
      }

      setDirty(false);
      setStatus('Changes saved and the GitHub Pages site was rebuilt.');
    }

    function buildSidebar() {
      sidebarList.innerHTML = '';
      Object.keys(contentData).forEach((section) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `sidebar-item${section === activeSection ? ' active' : ''}`;
        button.textContent = SECTION_LABELS[section] || prettyKey(section);
        button.addEventListener('click', () => {
          activeSection = section;
          buildSidebar();
          renderActiveSection();
        });
        sidebarList.appendChild(button);
      });
    }

    function renderActiveSection() {
      panelTitle.textContent = SECTION_LABELS[activeSection] || prettyKey(activeSection);
      panelCopy.textContent = SECTION_DESCRIPTIONS[activeSection] || 'Edit the selected section.';
      panelRoot.innerHTML = '';
      renderObjectSection(contentData[activeSection], [activeSection], panelRoot, true);
    }

    function renderObjectSection(objectValue, path, mount, isRoot) {
      const entries = Object.entries(objectValue || {});
      const primitiveEntries = entries.filter(([, value]) => isPrimitive(value));
      const nestedEntries = entries.filter(([, value]) => !isPrimitive(value));

      if (primitiveEntries.length) {
        const card = createCard(isRoot ? 'Fields' : prettyKey(path[path.length - 1]));
        const grid = document.createElement('div');
        grid.className = 'field-grid';
        primitiveEntries.forEach(([key, value]) => {
          grid.appendChild(renderPrimitiveField(key, value, [...path, key]));
        });
        card.body.appendChild(grid);
        mount.appendChild(card.wrapper);
      }

      nestedEntries.forEach(([key, value]) => {
        if (Array.isArray(value)) {
          mount.appendChild(renderArraySection(key, value, [...path, key]));
          return;
        }

        const card = createCard(prettyKey(key));
        renderObjectSection(value, [...path, key], card.body, false);
        mount.appendChild(card.wrapper);
      });

      if (!entries.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'This section is empty.';
        mount.appendChild(empty);
      }
    }

    function renderArraySection(key, items, path) {
      const card = createCard(prettyKey(key), [
        createButton('Add Item', 'ghost-btn', () => {
          const currentItems = getValueAtPath(path);
          const sample = currentItems[0] ?? arrayTemplates.get(path.join('.'));
          currentItems.push(makeEmptyClone(sample));
          setDirty(true);
          renderActiveSection();
        })
      ]);

      const list = document.createElement('div');
      list.className = 'array-list';

      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No items yet. Use Add Item to create one.';
        list.appendChild(empty);
      } else if (items.every((item) => isPrimitive(item))) {
        items.forEach((item, index) => {
          list.appendChild(renderPrimitiveArrayItem(key, item, [...path, index], index, items.length));
        });
      } else {
        items.forEach((item, index) => {
          list.appendChild(renderObjectArrayItem(key, item, [...path, index], index, items.length));
        });
      }

      card.body.appendChild(list);
      return card.wrapper;
    }

    function renderPrimitiveArrayItem(key, value, path, index, total) {
      const item = document.createElement('div');
      item.className = 'array-item';

      const head = document.createElement('div');
      head.className = 'array-item-head';

      const title = document.createElement('div');
      title.className = 'array-item-title';
      title.textContent = `${prettyKey(key)} ${index + 1}`;
      head.appendChild(title);
      head.appendChild(createArrayActions(path.slice(0, -1), index, total));
      item.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'field-grid';
      grid.appendChild(renderPrimitiveField('value', value, path, true));
      item.appendChild(grid);
      return item;
    }

    function renderObjectArrayItem(key, value, path, index, total) {
      const item = document.createElement('div');
      item.className = 'array-item';

      const head = document.createElement('div');
      head.className = 'array-item-head';

      const title = document.createElement('div');
      title.className = 'array-item-title';
      title.textContent = summarizeArrayItem(key, value, index);
      head.appendChild(title);
      head.appendChild(createArrayActions(path.slice(0, -1), index, total));
      item.appendChild(head);

      renderObjectSection(value, path, item, false);
      return item;
    }

    function createArrayActions(arrayPath, index, total) {
      const actions = document.createElement('div');
      actions.className = 'array-item-actions';
      actions.appendChild(createButton('Up', 'icon-btn', () => moveArrayItem(arrayPath, index, index - 1), index === 0));
      actions.appendChild(createButton('Down', 'icon-btn', () => moveArrayItem(arrayPath, index, index + 1), index === total - 1));
      actions.appendChild(createButton('Remove', 'danger-btn', () => removeArrayItem(arrayPath, index)));
      return actions;
    }

    function createCard(title, actions = []) {
      const wrapper = document.createElement('section');
      wrapper.className = 'editor-card';

      const head = document.createElement('div');
      head.className = 'card-head';

      const heading = document.createElement('div');
      heading.className = 'card-title';
      heading.textContent = title;
      head.appendChild(heading);

      if (actions.length) {
        const actionWrap = document.createElement('div');
        actionWrap.className = 'array-item-actions';
        actions.forEach((action) => actionWrap.appendChild(action));
        head.appendChild(actionWrap);
      }

      const body = document.createElement('div');
      wrapper.appendChild(head);
      wrapper.appendChild(body);

      return { wrapper, body };
    }

    function renderPrimitiveField(key, value, path, compactValueOnly = false) {
      if (typeof value === 'boolean') {
        const row = document.createElement('label');
        row.className = 'checkbox-row';

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = value;
        input.addEventListener('change', () => {
          setValueAtPath(path, input.checked);
          setDirty(true);
        });

        const labelText = document.createElement('span');
        labelText.textContent = compactValueOnly ? 'Enabled' : prettyKey(key);

        row.appendChild(input);
        row.appendChild(labelText);
        return row;
      }

      const row = document.createElement('div');
      row.className = 'field-row';

      if (!compactValueOnly) {
        const label = document.createElement('label');
        label.className = 'field-label';
        label.textContent = prettyKey(key);
        row.appendChild(label);
      }

      let control;
      if (shouldUseTextarea(key, value)) {
        control = document.createElement('textarea');
        control.className = 'text-area';
        control.value = value ?? '';
      } else {
        control = document.createElement('input');
        control.className = 'text-input';
        control.type = inferInputType(key);
        control.value = value ?? '';
      }

      control.addEventListener('input', () => {
        setValueAtPath(path, control.type === 'number' ? Number(control.value) : control.value);
        setDirty(true);
      });

      row.appendChild(control);
      if (compactValueOnly) {
        row.style.marginTop = '4px';
      }
      return row;
    }

    function moveArrayItem(arrayPath, fromIndex, toIndex) {
      const items = getValueAtPath(arrayPath);
      if (!Array.isArray(items) || toIndex < 0 || toIndex >= items.length) {
        return;
      }
      const [moved] = items.splice(fromIndex, 1);
      items.splice(toIndex, 0, moved);
      setDirty(true);
      renderActiveSection();
    }

    function removeArrayItem(arrayPath, index) {
      const items = getValueAtPath(arrayPath);
      if (!Array.isArray(items)) {
        return;
      }
      items.splice(index, 1);
      setDirty(true);
      renderActiveSection();
    }

    function getValueAtPath(path) {
      return path.reduce((current, segment) => current[segment], contentData);
    }

    function setValueAtPath(path, value) {
      const parent = getValueAtPath(path.slice(0, -1));
      parent[path[path.length - 1]] = value;
    }

    function setDirty(nextDirty) {
      dirty = nextDirty;
      saveButton.disabled = !dirty;
      saveButton.textContent = dirty ? 'Save Changes' : 'Saved';
    }

    function setStatus(message, type = 'success') {
      statusBar.textContent = message;
      statusBar.className = `status-bar show ${type}`;
      window.clearTimeout(setStatus.timeoutId);
      setStatus.timeoutId = window.setTimeout(() => {
        statusBar.className = 'status-bar';
      }, 2800);
    }

    function prettyKey(value) {
      return String(value)
        .replace(/_/g, ' ')
        .replace(/-/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, (match) => match.toUpperCase());
    }

    function isPrimitive(value) {
      return value === null || ['string', 'number', 'boolean'].includes(typeof value);
    }

    function shouldUseTextarea(key, value) {
      if (typeof value !== 'string') {
        return false;
      }
      return value.length > 90 || /description|paragraph|quote|text|intro|tagline|note|keywords|answer|copyright/i.test(key);
    }

    function inferInputType(key) {
      if (/email/i.test(key)) {
        return 'email';
      }
      if (/phone/i.test(key)) {
        return 'tel';
      }
      return 'text';
    }

    function summarizeArrayItem(sectionKey, item, index) {
      if (item && typeof item === 'object') {
        return item.name || item.label || item.title || item.question || item.id || `${prettyKey(sectionKey)} ${index + 1}`;
      }
      return `${prettyKey(sectionKey)} ${index + 1}`;
    }

    function makeEmptyClone(sample) {
      if (Array.isArray(sample)) {
        return [];
      }
      if (sample && typeof sample === 'object') {
        const clone = {};
        Object.entries(sample).forEach(([key, value]) => {
          clone[key] = makeEmptyClone(value);
        });
        return clone;
      }
      if (typeof sample === 'boolean') {
        return false;
      }
      if (typeof sample === 'number') {
        return 0;
      }
      return '';
    }

    function captureArrayTemplates(value, path = []) {
      if (Array.isArray(value)) {
        if (value.length > 0) {
          arrayTemplates.set(path.join('.'), deepClone(value[0]));
          captureArrayTemplates(value[0], path.concat('0'));
        }
        return;
      }

      if (value && typeof value === 'object') {
        Object.entries(value).forEach(([key, child]) => {
          captureArrayTemplates(child, path.concat(key));
        });
      }
    }

    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function createButton(label, className, onClick, disabled = false) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = className;
      button.textContent = label;
      button.disabled = disabled;
      button.addEventListener('click', onClick);
      return button;
    }
  </script>
</body>
</html>
